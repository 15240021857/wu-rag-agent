[project]
name = "rag-server"
version = "0.1.0"
description = "Markdown 解析与切块服务"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chunkana>=0.1.6",
    "fastapi>=0.162.0",
    "langchain>=1.4.8",
    "langchain-core>=1.7.4",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "markdownify>=1.2.4",
    "mineru-open-sdk>=0.2.5",
    "numpy>=2.0",
    "pydantic-settings>=2.16.2",
    "pymilvus[model]>=3.0.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag-server = "rag_server.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
